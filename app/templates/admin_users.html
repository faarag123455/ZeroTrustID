{% extends "base.html" %}
{% block content %}
<h2>Utilisateurs</h2>
<table border="1" cellpadding="4">
  <tr><th>ID</th><th>Email</th><th>Rôle</th><th>MFA</th><th>Verrouillé</th><th>Actions</th></tr>
  {% for u in users %}
  <tr>
    <td>{{ u.id }}</td>
    <td>{{ u.email }}</td>
    <td>{{ u.role }}</td>
    <td>{{ "oui" if u.mfa else "non" }}</td>
    <td>{{ "oui" if u.locked_until else "non" }}</td>
    <td>
      <form method="post" class="inline" action="{{ url_for('admin.set_role', user_id=u.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <select name="role">
          <option value="user" {{ "selected" if u.role == "user" }}>user</option>
          <option value="admin" {{ "selected" if u.role == "admin" }}>admin</option>
        </select>
        <button type="submit">Changer</button>
      </form>
      <form method="post" class="inline" action="{{ url_for('admin.unlock', user_id=u.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Débloquer</button>
      </form>
      <form method="post" class="inline" action="{{ url_for('admin.delete', user_id=u.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Supprimer</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
<p><a href="{{ url_for('auth.dashboard') }}">Retour</a></p>
{% endblock %}
