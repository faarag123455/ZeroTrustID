{% extends "base.html" %}
{% block content %}
<h2>Tableau de bord</h2>
<p>Connecté en tant que : {{ email }}</p>
<p><a href="{{ url_for('account.index') }}">Mon profil</a></p>
<p><a href="{{ url_for('documents.index') }}">Mes documents</a></p>
<p><a href="{{ url_for('admin.users') }}">Administration (admin)</a></p>
<form method="post" action="{{ url_for('auth.logout') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit">Se déconnecter</button>
</form>
{% endblock %}
