{% extends "base.html" %}
{% block content %}
<h2>Mes documents</h2>
<p><a href="{{ url_for('documents.new') }}">Nouveau document</a></p>
<ul>
  {% for d in docs %}
  <li><a href="{{ url_for('documents.view', doc_id=d.id) }}">Document {{ d.id }}</a> ({{ d.created_at }})</li>
  {% else %}
  <li>Aucun document.</li>
  {% endfor %}
</ul>
<p><a href="{{ url_for('auth.dashboard') }}">Retour</a></p>
{% endblock %}
